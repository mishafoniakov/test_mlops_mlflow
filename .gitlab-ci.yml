stages:
  - validate
  - deploy

default:
  interruptible: true

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"

.prepare_env:
  before_script:
    - cp .env.example .env
    - sed -i 's/\r$//' .env .env.example || true
    - sed -i '1s/^\xEF\xBB\xBF//' .env || true

validate:compose:
  extends: .prepare_env
  stage: validate
  image: docker:24-cli
  script:
    - docker compose version
    - docker compose config --quiet
    - echo "docker-compose.yml is valid"

validate:dags:
  stage: validate
  image: python:3.11-slim
  script:
    - python -m py_compile dags/mlflow_iris_demo.py
    - echo "DAG syntax is valid"

deploy:
  stage: deploy
  image: alpine:3.20
  needs:
    - validate:compose
    - validate:dags
  before_script:
    - apk add --no-cache openssh-client git
    - eval "$(ssh-agent -s)"
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
  script:
    - |
      ssh "$DEPLOY_USER@$DEPLOY_HOST" "
        set -e
        cd '$DEPLOY_PATH'
        git fetch origin
        git checkout '$CI_COMMIT_BRANCH'
        git pull origin '$CI_COMMIT_BRANCH'
        docker compose down
        docker compose up -d --build
      "
  environment:
    name: production
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual
