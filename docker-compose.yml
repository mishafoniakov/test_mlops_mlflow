x-airflow-common: &airflow-common
  build: .
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres/${POSTGRES_DB}
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__WEBSERVER__PID: /tmp/airflow-webserver.pid
    MLFLOW_TRACKING_URI: http://mlflow:5000
    AIRFLOW_CONN_CLICKHOUSE_DEFAULT: clickhouse://${CLICKHOUSE_USER}:${CLICKHOUSE_PASSWORD}@${CLICKHOUSE_HOST}:${CLICKHOUSE_PORT}/${CLICKHOUSE_DB}
    AIRFLOW_CONN_REDIS_DEFAULT: redis://redis:6379/0
    PYTHONPATH: /opt/airflow
    GIT_PYTHON_REFRESH: quiet
  volumes:
    - ./dags:/opt/airflow/dags
    - ./scripts:/opt/airflow/scripts
    - ./queries:/opt/airflow/queries
    - mlflow_artifacts:/mlflow/artifacts
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  networks:
    - default
    - clickhouse_net

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_HOST_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER}"]
      interval: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_HOST_PORT}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.14.1
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${MLFLOW_HOST_PORT}:5000"
    volumes:
      - mlflow_artifacts:/mlflow/artifacts
      - mlflow_db:/mlflow/db
    entrypoint:
      - /bin/bash
      - -c
      - |
        mkdir -p /mlflow/artifacts /mlflow/db
        chmod -R 777 /mlflow/artifacts /mlflow/db
        exec mlflow server \
          --backend-store-uri sqlite:////mlflow/db/mlflow.db \
          --default-artifact-root mlflow-artifacts:/ \
          --artifacts-destination /mlflow/artifacts \
          --serve-artifacts \
          --host 0.0.0.0 \
          --port 5000
    restart: unless-stopped

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create \
        --username ${AIRFLOW_ADMIN_USERNAME} \
        --password ${AIRFLOW_ADMIN_PASSWORD} \
        --firstname Admin \
        --lastname User \
        --role Admin \
        --email ${AIRFLOW_ADMIN_EMAIL} || true
        airflow variables set MLFLOW_EXPERIMENT_NAME mlflow_test_snu
        airflow variables set REGRESSION_QUERY "select ts_month, ts_day_year, ts_day_month, ts_day_week, ts_hour, ts_minute, ts_second, aggregate_temp_c_lag, is_anomaly, aggregate_temp_diff, target from snu.telemetry_aggregate_temp_c_3600 where well_id = 'SNU-001' and ts <= toDateTime64('2026-08-06 23:59:59', 3, 'UTC')"
        airflow variables set CLASSIFICATION_QUERY "select ts_month, ts_day_year, ts_day_month, ts_day_week, ts_hour, ts_minute, ts_second, aggregate_temp_c_lag, is_anomaly, aggregate_temp_diff, target from snu.telemetry_anomaly_3600 where well_id = 'SNU-001' and ts <= toDateTime64('2026-08-06 23:59:59', 3, 'UTC')"
        airflow variables set PREDICT "select ts, ts_month, ts_day_year, ts_day_month, ts_day_week, ts_hour, ts_minute, ts_second, aggregate_temp_c_lag, is_anomaly, aggregate_temp_diff from snu.telemetry_aggregate_temp_c_3600 where well_id = 'SNU-001' and ts > toDateTime64('2026-08-06 23:59:59', 3, 'UTC')"
        airflow variables set MODEL_URI 0000000
        airflow variables set TRAIN_SPLIT 0.8
    restart: "no"

  airflow-webserver:
    <<: *airflow-common
    command:
      - bash
      - -c
      - rm -f /tmp/airflow-webserver.pid /opt/airflow/airflow-webserver.pid && exec airflow webserver
    ports:
      - "${AIRFLOW_WEBSERVER_HOST_PORT}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 40s
    restart: unless-stopped

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  postgres_data:
  mlflow_artifacts:
  mlflow_db:

networks:
  clickhouse_net:
    name: clickhouse_default
    external: true
